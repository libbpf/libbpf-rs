[workspace.package]
version = "0.27.2"
edition = "2021"
rust-version = "1.89"
license = "LGPL-2.1-only OR BSD-2-Clause"
repository = "https://github.com/libbpf/libbpf-rs"
homepage = "https://github.com/libbpf/libbpf-rs"

[workspace]
members = [
  "libbpf-cargo",
  "libbpf-rs",
  "libbpf-rs/dev",
  "examples/bpf_query",
  "examples/btf_query",
  "examples/capable",
  "examples/compiler_warnings",
  "examples/netfilter_blocklist",
  "examples/ringbuf_multi",
  "examples/runqslower",
  "examples/tc_port_whitelist",
  "examples/tcp_ca",
  "examples/tcp_option",
  "examples/tproxy",
  "examples/task_longrun",
]
resolver = "2"

[workspace.lints.rust]
deprecated_safe = "warn"
future_incompatible = "warn"
keyword_idents = "warn"
let_underscore = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
trivial_numeric_casts = "warn"
unexpected_cfgs = {level = "warn", check-cfg = ['cfg(has_procmap_query_ioctl)', 'cfg(has_large_test_files)']}
unsafe_op_in_unsafe_fn = "warn"
unused = "warn"

[workspace.lints.clippy]
collapsible_else_if = "allow"
collapsible_if = "allow"
fn_to_numeric_cast = "allow"
let_and_return = "allow"
let_unit_value = "allow"
module_inception = "allow"
type_complexity = "allow"
absolute_paths = "warn"
as_ptr_cast_mut = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
doc_markdown = "warn"
join_absolute_paths = "warn"
large_enum_variant = "warn"
ptr_as_ptr = "warn"
redundant_closure_for_method_calls = "warn"
unchecked_time_subtraction = "warn"
uninlined_format_args = "warn"
use_self = "warn"
wildcard_imports = "warn"
